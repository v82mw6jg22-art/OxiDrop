.tile:active{transform:translateY(1px)}
.tile i{position:absolute;top:4px;right:5px;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 10px Arial;color:#fff;background:rgba(0,0,0,.7);border-radius:8px;padding:0 5px}
.hchip{min-width:36px;height:36px;padding:0 6px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#1a1200;flex:none}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px auto 0;max-width:320px}
.cell{aspect-ratio:1;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,#34343b,#17171c);box-shadow:inset 1px 1px 0 rgba(255,255,255,.18),inset 0 -6px 10px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.5);position:relative;overflow:hidden;min-height:0;padding:0}
.cell:active{transform:scale(.95)}.cell svg{position:absolute;inset:18%;width:64%;height:64%}
.cell.safe{background:radial-gradient(circle,rgba(255,138,60,.35),rgba(20,8,6,.9));border-color:rgba(255,138,60,.6);box-shadow:0 0 14px rgba(255,120,40,.4),inset 0 0 12px rgba(255,120,40,.3)}
.cell.mine,.cell.boom{background:radial-gradient(circle,rgba(255,40,40,.5),rgba(20,4,6,.95));border-color:#ff2d2d}.cell.boom{box-shadow:0 0 22px #ff2d2d}.cell.dim{opacity:.5}
.gbtn.ybtn{background:linear-gradient(rgba(255,95,85,.95),rgba(200,20,35,.95));color:#fff;border-color:rgba(255,255,255,.3);box-shadow:inset 1px 1px 0 rgba(255,255,255,.45),0 4px 16px rgba(255,35,50,.45)}
.tab{border:1px solid transparent;border-radius:9999px;color:rgba(255,255,255,.6);font-family:'Russo One',Arial,sans-serif;font-size:12px;line-height:1.15;padding-left:2px;padding-right:2px}
.tab[aria-selected=true]{background:linear-gradient(rgba(255,70,70,.5),rgba(150,10,25,.55));color:#fff;border-color:rgba(255,255,255,.3);box-shadow:inset 1px 1px 1px rgba(255,255,255,.4),0 0 16px rgba(255,40,50,.45)}
#nav{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:424px;margin:0 auto;z-index:20;padding:6px;background:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.03)),rgba(15,5,8,.6)}

.grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:5px;margin-bottom:12px}
.sg{flex:1 1 calc(33.333% - 4px)}
#cv,#pc,#uc{position:relative;z-index:1;width:100%;height:auto;display:block}
.glass::after{content:"";position:absolute;left:14%;right:14%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:8px;padding-bottom:8px}
.ni{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true] .ni{filter:drop-shadow(0 0 6px rgba(255,90,80,.9))}
.ybtn,.gbtn,.sg,.tab,.tile,.cell{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease}
.ybtn:active,.gbtn:active,.sg:active{transform:scale(.97)}
.bal b,.st b{font-variant-numeric:tabular-nums}
.b1{animation:drift1 20s ease-in-out infinite;will-change:transform}.b2{animation:drift2 26s ease-in-out infinite;will-change:transform}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(46px,38px,0)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-52px,-30px,0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{animation:fadeUp .3s ease-out}
@keyframes pop{0%{transform:scale(.75);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.msg.pop{animation:pop .45s ease-out}
@keyframes fUp{0%{color:#6dffa3;text-shadow:0 0 14px #3dff8a;transform:scale(1.12)}100%{transform:none}}
@keyframes fDn{0%{color:#ff7a8a;text-shadow:0 0 14px #ff2d2d;transform:scale(.92)}100%{transform:none}}
.fUp{animation:fUp .9s ease-out}.fDn{animation:fDn .9s ease-out}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 20px 'Russo One',Arial,sans-serif;background:linear-gradient(#ff5a4d,#a50f1c);border:1px solid rgba(255,255,255,.35);box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),0 0 18px rgba(255,40,50,.45)}
.row-btn{display:flex;align-items:center;gap:12px;font-weight:600}.ri{font-size:20px;width:26px;text-align:center}.chev{margin-left:auto;opacity:.5;font-size:22px;line-height:1}
#age{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(70% 50% at 50% 30%,rgba(255,40,50,.4),#050507 72%)}
.agebox{max-width:380px;width:100%}
.age-badge{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 30px 'Russo One',Arial,sans-serif;border:3px solid #ff2d2d;color:#fff;box-shadow:0 0 24px rgba(255,45,45,.6),inset 0 0 14px rgba(255,45,45,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const num=(v,d)=>typeof v==='number'&&isFinite(v)&&v>=0&&v<1e9?v:d;
let refund=0;
try{const s=JSON.parse(localStorage.getItem('oxi2')||'null');if(s&&typeof s==='object'){const o=s.st&&typeof s.st==='object'?s.st:{};
  st.bal=num(o.bal,200);st.dep=num(o.dep,0);
  st.hist=Array.isArray(o.hist)?o.hist.slice(0,40).filter(x=>x&&typeof x==='object').map(x=>({k:['wheel','plinko','mines','upgrader'].includes(x.k)?x.k:'wheel',r:num(x.r,0),c:[1,3,5,10,20].includes(x.c)?x.c:1,bet:num(x.bet,0),win:num(x.win,0),x:num(x.x,0)})):[];

  st.pres=Array.isArray(o.pres)?o.pres.filter(m=>typeof m==='number'&&isFinite(m)).slice(0,10):[];
  if(o.used&&typeof o.used==='object')Object.keys(o.used).forEach(k=>{if(/^[A-Z0-9_-]{1,32}$/.test(k))st.used[k]=1});
  [o.pend,o.pe].forEach(x=>{if(x&&typeof x==='object')Object.values(x).forEach(v=>{refund+=num(v,0)})});
  lang=s.lang==='en'?'en':'ru';sound=s.sound!==false}}catch(e){}
const save=()=>{try{localStorage.setItem('oxi2',JSON.stringify({st,lang,sound}))}catch(e){}};

/* sound */
let ac;function beep(f=440,d=.06,ty='sine',at=0,vol=.07){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const sfxWin=()=>{[523,659,784,1047,1319].forEach((f,i)=>beep(f,.2,'triangle',i*.08,.09))};
const sfxLoss=()=>{[392,330,262,196].forEach((f,i)=>beep(f,.24,'sawtooth',i*.11,.05))};
const hap=k=>{try{tg&&tg.HapticFeedback.impactOccurred(k||'light')}catch(e){}};

let curTab='game';let lastBal;let lastFocus=null;
function modal(title,nodes,btns){$('#mTitle').textContent=title;$('#mBody').replaceChildren(...nodes);const f=$('#mFoot');f.replaceChildren();
  (btns||[]).forEach(b=>{const e=document.createElement('button');e.className=(b.primary?'ybtn':'gbtn')+' px-5 py-2';e.textContent=b.text;e.onclick=()=>{if(b.fn&&b.fn()===false)return;closeM()};f.append(e)});
  const m=$('#modal');lastFocus=document.activeElement;m.classList.remove('hidden');m.classList.add('flex');document.body.style.overflow='hidden';$('#mClose').focus()}
function closeM(){const m=$('#modal');m.classList.add('hidden');m.classList.remove('flex');document.body.style.overflow='';try{lastFocus&&lastFocus.focus()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||$('#modal').classList.contains('hidden'))return;const f=$$('#modal button,#modal input,#modal a[href]');if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
$('#mClose').onclick=closeM;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* colors / wheel data */
const COL={1:'#F5C518',3:'#3CB54E',5:'#3A97F0',10:'#F57A1F',20:'#EA46AD'},MUL=[1,3,5,10,20];
const SEQ=[1,3,1,5,1,3,1,10,1,3,1,5,1,20,1,3,1,5,1,10,1,3,1,5,3],N=SEQ.length,A=2*Math.PI/N,TAU=2*Math.PI;
const mix=(h,k)=>'rgb('+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*k)).join()+')';
function prng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function weather(g,rnd,R,r0,n){for(let i=0;i<n;i++){const a=rnd()*TAU,r=r0+Math.sqrt(rnd())*(R-r0),x=Math.cos(a)*r,y=Math.sin(a)*r,k=rnd();
  g.fillStyle=k<.55?'rgba(55,22,8,'+(.15+rnd()*.35)+')':k<.88?'rgba(135,62,24,'+(.2+rnd()*.4)+')':'rgba(255,238,200,'+(.08+rnd()*.15)+')';
  g.beginPath();g.arc(x,y,.6+rnd()*rnd()*3.4,0,TAU);g.fill()}
  g.strokeStyle='rgba(50,20,8,.3)';g.lineWidth=1;for(let i=0;i<n/18;i++){const a=rnd()*TAU,r=r0+rnd()*(R-r0),x=Math.cos(a)*r,y=Math.sin(a)*r;g.beginPath();g.moveTo(x,y);g.lineTo(x+(rnd()-.5)*26,y+(rnd()-.5)*26);g.stroke()}}
function makeFace(){const f=document.createElement('canvas');f.width=f.height=700;const g=f.getContext('2d'),rnd=prng(11);g.translate(350,350);
  let rg=g.createRadialGradient(0,0,300,0,0,345);rg.addColorStop(0,'#5a3524');rg.addColorStop(.5,'#84502f');rg.addColorStop(1,'#3b2216');
  g.beginPath();g.arc(0,0,345,0,TAU);g.fillStyle=rg;g.fill();
  g.save();g.beginPath();g.arc(0,0,345,0,TAU);g.clip();weather(g,rnd,345,312,1400);g.restore();
  for(let k=0;k<12;k++){g.save();g.rotate(k*TAU/12+TAU/24);g.fillStyle='#5b3a2a';g.strokeStyle='#241309';g.lineWidth=2;g.fillRect(-17,-342,34,30);g.strokeRect(-17,-342,34,30);
    g.fillStyle='#b08a64';[[-9,-333],[9,-333]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],3.4,0,TAU);g.fill()});g.restore()}
  g.save();g.beginPath();g.arc(0,0,312,0,TAU);g.clip();
  SEQ.forEach((v,i)=>{const a0=i*A-Math.PI/2;g.beginPath();g.moveTo(0,0);g.arc(0,0,312,a0,a0+A);g.closePath();
    const gr=g.createRadialGradient(0,0,100,0,0,312);gr.addColorStop(0,mix(COL[v],.62));gr.addColorStop(1,mix(COL[v],.88));g.fillStyle=gr;g.fill();g.strokeStyle='rgba(30,14,5,.8)';g.lineWidth=3;g.stroke();
    g.save();g.rotate(a0+A/2+Math.PI/2);g.fillStyle='rgba(22,13,6,.9)';g.font=(v>9?'900 38px':'900 48px')+' "Arial Black",Impact,Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(v,0,-245);g.restore()});
  weather(g,rnd,312,100,5200);g.restore();
  g.beginPath();g.arc(0,0,312,0,TAU);g.strokeStyle='#2a170d';g.lineWidth=5;g.stroke();return f}
function makeOver(){const o=document.createElement('canvas');o.width=720;o.height=400;const g=o.getContext('2d'),rnd=prng(5);
  g.save();g.translate(360,380);let h=g.createRadialGradient(0,-30,10,0,0,102);h.addColorStop(0,'#8a4d2c');h.addColorStop(1,'#4a2819');
  g.beginPath();g.arc(0,0,102,0,TAU);g.fillStyle=h;g.fill();g.save();g.clip();weather(g,rnd,102,0,900);g.restore();
  g.lineWidth=5;g.strokeStyle='#26140a';g.stroke();g.beginPath();g.arc(0,0,92,0,TAU);g.strokeStyle='rgba(255,200,150,.18)';g.lineWidth=2;g.stroke();g.restore();
  g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=12;g.shadowOffsetY=4;g.beginPath();g.moveTo(320,0);g.lineTo(400,0);g.lineTo(360,70);g.closePath();
  const pg=g.createLinearGradient(0,0,0,70);pg.addColorStop(0,'#d24b3a');pg.addColorStop(1,'#8d2a20');g.fillStyle=pg;g.fill();g.restore();
  g.save();g.beginPath();g.moveTo(320,0);g.lineTo(400,0);g.lineTo(360,70);g.closePath();g.clip();g.translate(360,20);weather(g,rnd,60,0,260);g.restore();
  g.beginPath();g.moveTo(320,0);g.lineTo(400,0);g.lineTo(360,70);g.closePath();g.strokeStyle='#3a1510';g.lineWidth=3;g.stroke();
  g.beginPath();g.arc(360,17,6,0,TAU);g.fillStyle='#b9a78c';g.fill();g.strokeStyle='#2a1a10';g.lineWidth=1.5;g.stroke();return o}

  spin={t0:Date.now(),dur,from:theta,to:theta+((need-cur+TAU)%TAU)+TAU*(dur>3000?5:2),w,round:rnd};msg('')}

  const nb={1:0,3:0,5:0,10:0,20:0};Object.keys(s.mine||{}).forEach(k=>{if(k in nb)nb[k]=s.mine[k]});bets=nb;
  if(phase!=='spin')st.res=(s.history||[]).slice(0,12);
  tEnd=now+Math.max(0,s.left)*1000;
  if(s.phase==='bet'){if(phase!=='bet'){phase='bet';msg('')}}
  else if(s.phase==='spin'){if(!spin||spin.round!==s.round)startSpinTo(s.idx,Math.max(700,Math.min(6000,s.left*1000)),s.round)}
  else if(phase!=='spin'){phase='result';last=s.color;
    if(msgRound!==s.round){msgRound=s.round;const tot=total(),pay=r2((bets[last]||0)*(last+1));
      if(tot>0){pushH('wheel',tot,pay,last+1,last);msg(pay>0?t('win')+': +'+fmt(pay):t('loss')+': −'+fmt(tot),pay>0?winCol:lossCol);if(onWheel())(pay>0?sfxWin:sfxLoss)();tgOk(pay>0)}}}

  if(phase==='spin'&&spin){const p=Math.min((now-spin.t0)/spin.dur,1);theta=spin.from+(spin.to-spin.from)*(1-Math.pow(1-p,4));
    const i=Math.floor((((-theta%TAU)+TAU)%TAU)/A);if(i!==lastIdx){lastIdx=i;if(onWheel())beep(260+(i%5)*30,.025,'square')}
    if(p>=1){phase='result';last=SEQ[spin.w];tEnd=now}}
  if(!wBusy&&((now>=tEnd&&now-wsAt>600)||now-wsAt>6000))wsync()}
async function srvPlace(c){if(phase!=='bet')return msg(t('closed'),lossCol);const a=amt();if(a>st.bal+1e-9)return msg(t('nofunds'),lossCol);if(inflight>=3)return;inflight++;
  try{const r=await api('/api/wheel/bet',{color:c,amount:a});st.bal=r.balance;bets[c]=r2(bets[c]+a);msg('');render();beep(600+c*8,.05);hap()}catch(e){netErr(e);wsAt=0}finally{inflight--}}
async function srvClear(){if(phase!=='bet')return;try{const r=await api('/api/wheel/clear',{});st.bal=r.balance;MUL.forEach(c=>bets[c]=0);render()}catch(e){netErr(e)}}
function mkPts(path){let R=0;const pts=[{x:CXM,y:18}];for(let r=0;r<RW;r++){pts.push({x:CXM+(2*R-r)*DX/2,y:Y0+r*DY-12});R+=path[r]}pts.push({x:CXM+(2*R-RW)*DX/2,y:508});return pts}
async function srvDrop(){const a=amt();if(a>st.bal+1e-9)return msg(t('nofunds'),lossCol);if(balls.length+dInfl>=20)return;dInfl++;
  try{const rk=risk,r=await api('/api/plinko',{bet:a,risk:rk});st.bal=r2(st.bal-a);balls.push({t0:Date.now(),pts:mkPts(r.path),k:r.k,bet:a,rk,win:r.win});msg('');render();beep(520,.05);hap()}catch(e){netErr(e)}finally{dInfl--}}
function srvMEnd(r,win,hit){mn.on=false;mn.over=true;mn.hit=hit;if(r.mines)mn.mines=new Set(r.mines);st.bal=r.balance;pushH('mines',mn.bet,r.win,win?r.mult:0);
  msg(win?t('win')+': +'+fmt(r.win)+' (×'+r.mult.toFixed(2)+')':t('boom'),win?winCol:lossCol);beep(win?784:140,.25,win?'sine':'sawtooth');tgOk(win);render();renderM()}
async function srvMinesMain(){if(mBusy)return;mBusy=true;
  try{if(!mn.on){const a=amt();if(a>st.bal+1e-9)return msg(t('nofunds'),lossCol);const r=await api('/api/mines/start',{bet:a,cnt:mn.cnt});
      st.bal=r.balance;mn.bet=a;mn.mines=new Set();mn.open=new Set();mn.on=true;mn.over=false;mn.hit=-1;msg('');render();renderM();beep(480,.06)}
    else srvMEnd(await api('/api/mines/cash',{}),true,-1)}catch(e){netErr(e)}finally{mBusy=false}}
async function srvPick(i){if(mBusy||!mn.on||mn.open.has(i))return;mBusy=true;
  try{const r=await api('/api/mines/pick',{i});if(r.safe){mn.open.add(i);beep(500+mn.open.size*35,.05);hap();if(r.done)srvMEnd(r,true,-1);else renderM()}else srvMEnd(r,false,i)}
  catch(e){netErr(e)}finally{mBusy=false}}
async function srvCoupon(){const m=$('#cmsg'),c=$('#code').value.trim().toUpperCase();m.style.color=lossCol;if(!c){m.textContent=t('c_empty');return}
  try{const r=await api('/api/coupon',{code:c});st.bal=r.balance;m.style.color=winCol;m.textContent=t('c_ok')+' '+r.amount;render();beep(740,.15)}catch(e){m.textContent=errText(e)}}
async function srvInit(){
  try{const j=await api('/api/me');st.bal=j.balance;ready=true;if(j.name)$('#uname').textContent=j.name;render()}catch(e){msg(errText(e),lossCol)}
  try{const m=await api('/api/mines/state');if(m.active){mn.on=true;mn.cnt=m.cnt;mn.bet=m.bet;mn.open=new Set(m.opened);mn.mines=new Set();mn.over=false;renderM()}}catch(e){}
  wsync()}
if(SRV){const infoPay=()=>modal(t('topup_t'),[P(t('srv_pay'))],[{text:t('close'),primary:true}]);
  $('#plus').onclick=$('#topup').onclick=$('#wd').onclick=infoPay;$('#clear').onclick=srvClear;$('#drop').onclick=srvDrop;$('#mMain').onclick=srvMinesMain;$('#apply').onclick=srvCoupon}

/* ---------- апгрейдер ---------- */
const UM=[1.5,2,3,5,10,20],uc=$('#uc'),ux=uc.getContext('2d'),uChance=m=>.97/m;let uMult=2,uAng=0,uAnim=null,uBusy=false;PD.u=0;
UM.forEach(m=>{const b=document.createElement('button');b.dataset.m=m;b.textContent='×'+m;b.onclick=()=>{if(uAnim||uBusy)return;uMult=m;renderU();beep(480,.04)};$('#upMults').append(b)});
function renderU(){$$('#upMults button').forEach(b=>b.className='gbtn py-2'+(+b.dataset.m===uMult?' ybtn':''));$('#upGo').disabled=!!(uAnim||uBusy)}
function drawU(){const W=480,H=420,X=240,Y=215,R=150,c=uChance(uMult);ux.clearRect(0,0,W,H);
  let g=ux.createRadialGradient(X,Y,R-24,X,Y,R+32);g.addColorStop(0,'#4a2c18');g.addColorStop(.5,'#84502f');g.addColorStop(1,'#2e1a0e');
  ux.beginPath();ux.arc(X,Y,R+32,0,TAU);ux.moveTo(X+R-24,Y);ux.arc(X,Y,R-24,0,TAU,true);ux.fillStyle=g;ux.fill();
  ux.strokeStyle='rgba(255,220,180,.38)';ux.lineWidth=2;for(let i=0;i<60;i++){const a=i*TAU/60,l=i%5?6:12;ux.beginPath();ux.moveTo(X+Math.cos(a)*(R+30),Y+Math.sin(a)*(R+30));ux.lineTo(X+Math.cos(a)*(R+30-l),Y+Math.sin(a)*(R+30-l));ux.stroke()}
  ux.lineWidth=26;ux.strokeStyle='#3a0b10';ux.beginPath();ux.arc(X,Y,R-2,0,TAU);ux.stroke();
  ux.save();ux.shadowColor='#3dff8a';ux.shadowBlur=18;ux.strokeStyle='#27d878';ux.beginPath();ux.arc(X,Y,R-2,-Math.PI/2,-Math.PI/2+c*TAU);ux.stroke();ux.restore();
  ux.save();ux.translate(X,Y);ux.rotate(uAng);ux.shadowColor='rgba(0,0,0,.75)';ux.shadowBlur=10;ux.fillStyle='#ff3b30';ux.beginPath();ux.moveTo(0,-(R+26));ux.lineTo(-13,-(R-24));ux.lineTo(13,-(R-24));ux.closePath();ux.fill();ux.restore();
  g=ux.createRadialGradient(X,Y-20,6,X,Y,86);g.addColorStop(0,'#8a4d2c');g.addColorStop(1,'#3b2014');ux.beginPath();ux.arc(X,Y,86,0,TAU);ux.fillStyle=g;ux.fill();ux.lineWidth=5;ux.strokeStyle='#26140a';ux.stroke();
  ux.textAlign='center';ux.fillStyle='#fff';ux.shadowColor='rgba(0,0,0,.7)';ux.shadowBlur=8;ux.font='800 50px system-ui,Arial';ux.fillText('×'+uMult,X,Y+10);ux.shadowBlur=0;
  ux.fillStyle='rgba(255,255,255,.8)';ux.font='600 15px system-ui,Arial';ux.fillText(t('up_chance')+' '+(c*100).toFixed(1)+'%',X,Y+40)}
function startU(win,done){const c=uChance(uMult),a0=((uAng%TAU)+TAU)%TAU,tgt=win?(.1+Math.random()*.8)*c*TAU:(c+(.06+Math.random()*.88)*(1-c))*TAU;
  uAnim={t0:Date.now(),dur:3400,from:uAng,to:uAng+((tgt-a0+TAU)%TAU)+TAU*5,done,li:-1};renderU()}
function stepU(now){if(!uAnim)return;const p=Math.min((now-uAnim.t0)/uAnim.dur,1);uAng=uAnim.from+(uAnim.to-uAnim.from)*(1-Math.pow(1-p,4));
  const i=Math.floor(uAng/(TAU/48));if(i!==uAnim.li){uAnim.li=i;if(onUpg())beep(300+(i%6)*25,.02,'square')}
  if(p>=1){const d=uAnim.done;uAnim=null;renderU();d()}}
function upDone(win,a,pay,balance){st.bal=balance!==undefined?balance:r2(st.bal+pay);PD.u=0;pushH('upgrader',a,pay,uMult);
  msg(win?t('win')+': +'+fmt(pay-a):t('loss')+': −'+fmt(a),win?winCol:lossCol);if(onUpg())(win?sfxWin:sfxLoss)();tgOk(win);render()}
$('#upGo').onclick=async()=>{if(uAnim||uBusy)return;const a=amt();if(a>st.bal+1e-9)return msg(t('nofunds'),lossCol);uBusy=true;renderU();
  try{if(SRV){const m=uMult,r=await api('/api/upgrade',{bet:a,mult:m});st.bal=r2(st.bal-a);render();msg('');startU(r.win,()=>upDone(r.win,a,r.payout,r.balance))}
    else{const win=Math.random()<uChance(uMult),pay=win?r2(a*uMult):0;st.bal=r2(st.bal-a);PD.u=a;render();msg('');startU(win,()=>upDone(win,a,pay))}}
  catch(e){netErr(e)}finally{uBusy=false;renderU()}};

/* ---------- возрастное подтверждение 18+ ---------- */
const AGE_KEY='oxi_age18';
function ageGate(){const g=$('#age'),lock=on=>['.wrap','#nav'].forEach(s=>{const e=$(s);if(e)e.inert=on});let ok=false;try{ok=localStorage.getItem(AGE_KEY)==='1'}catch(e){}
  if(ok){g.classList.add('hidden');lock(false);return}
  lock(true);g.classList.remove('hidden');
  $('#ageYes').onclick=()=>{try{localStorage.setItem(AGE_KEY,'1')}catch(e){}g.classList.add('hidden');lock(false);beep(600,.08)};
  $('#ageNo').onclick=()=>{$('#ageAsk').classList.add('hidden');$('#ageStop').classList.remove('hidden')};
  $('#ageClose').onclick=()=>{try{tg&&tg.close()}catch(e){}}}

/* ---------- профиль: бонусы и сотрудничество ---------- */
$('#rowBonus').onclick=()=>modal(t('bonuses'),[P(t('bonus_t'),'leading-relaxed')],[{text:t('close')},{text:t('bonus_btn'),primary:true,fn:()=>{const e=$('#code');e.scrollIntoView({block:'center'});setTimeout(()=>e.focus({preventScroll:true}),200)}}]);
$('#rowCoop').onclick=()=>{const box=document.createElement('div'),ul=document.createElement('ul'),m=P('','sub text-sm');box.append(P(t('coop_t'),'leading-relaxed'));ul.className='my-3';
  ['coop_c1','coop_c2','coop_c3'].forEach(k=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');li.className='py-2 flex gap-2';a.textContent='✓';a.style.color='#6dffa3';b.textContent=t(k);li.append(a,b);ul.append(li)});
  linkify(m,t('coop_m'));box.append(ul,m);
  modal(t('coop'),[box],[{text:t('close')},{text:t('coop_btn'),primary:true,fn:()=>{const u='https://t.me/oxidedrop_1';tg?tg.openTelegramLink(u):window.open(u,'_blank','noopener,noreferrer')}}])};

/* language / sound / init */
function applyLang(){document.documentElement.lang=lang;$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $$('.lg').forEach(b=>{b.className='gbtn flex-1 py-2 lg'+(b.dataset.l===lang?' ybtn':'')});$('#uname').textContent=uname;$('#avatar').textContent=([...uname][0]||'?').toUpperCase();render();renderBets();renderM();renderP();renderU()}
$$('.lg').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();beep(560,.04)});
$('#sndBtn').onclick=()=>{sound=!sound;render();beep(560,.06)};
let uname=t('guest');try{const u=tg.initDataUnsafe.user;if(u){uname=[u.first_name,u.last_name].filter(Boolean).join(' ');$('#uid').textContent='ID '+u.id}}catch(e){}
showGame('wheel');applyLang();ageGate();tab('game',1);requestAnimationFrame(frame);if(SRV)srvInit();
})();
</script>
